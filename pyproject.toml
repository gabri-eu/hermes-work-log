[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-work-log"
version = "0.1.0"
description = "Produto de captura: linguagem natural -> Atividade do hermes-core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hermes-core @ git+https://github.com/gabri-eu/hermes-core.git@ee437696f0c38bad0ad4dc3a79c6dc028a756e4d",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
